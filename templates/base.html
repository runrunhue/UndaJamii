<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>UndaJamii – {% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<div class="phone-frame">

    <header class="app-topbar">
        <div class="app-title">
            <i class="bi bi-tools"></i>
            <span>UndaJamii</span>
        </div>
        <div class="topbar-actions">
            <a href="{{ url_for('filter_page') }}" class="icon-btn" title="Filter">
                <i class="bi bi-funnel"></i>
            </a>
            <a href="{{ url_for('stats_page') }}" class="icon-btn" title="Stats">
                <i class="bi bi-bar-chart"></i>
            </a>
        </div>
    </header>

    <main class="app-body">
        <div class="toast-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="toast-msg {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
        </div>

        {% block content %}{% endblock %}
    </main>

    <nav class="app-bottomnav">
        <a href="{{ url_for('index') }}"
           class="nav-tab {% if request.endpoint == 'index' %}active{% endif %}">
            <i class="bi bi-house-door-fill"></i>
            <span>Home</span>
        </a>
        <a href="{{ url_for('register') }}"
           class="nav-tab {% if request.endpoint == 'register' %}active{% endif %}">
            <i class="bi bi-plus-square-fill"></i>
            <span>Register</span>
        </a>
        <a href="{{ url_for('search') }}"
           class="nav-tab {% if request.endpoint == 'search' %}active{% endif %}">
            <i class="bi bi-search"></i>
            <span>Search</span>
        </a>
        <button type="button" class="nav-tab" id="theme-toggle">
            <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
            <span id="theme-label">Theme</span>
        </button>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
